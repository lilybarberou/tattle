# Tattle, ready to run: no source code needed, Docker pulls the image.
# Guide: docs/SELF-HOSTING.md
#
#   docker compose up -d                     → http://127.0.0.1:3000 on this machine
#   docker compose --profile https up -d     → https://$DOMAIN, certificate included
name: tattle
services:
  app:
    image: ghcr.io/lilybarberou/tattle:${TATTLE_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://tattle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tattle
    ports:
      # Only this machine by default: a reverse proxy (the https profile, or
      # your own) faces the internet. APP_BIND=0.0.0.0 opens it to the network.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - storage:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tattle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tattle
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tattle -d tattle"]
      interval: 5s
      timeout: 5s
      retries: 20

  # HTTPS for $DOMAIN with a free certificate (Let's Encrypt), renewed by
  # itself. Point the domain at this server first, and set TRUST_PROXY=true.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db:
  storage:
  caddy-data:
