# Publishes the Docker image to GitHub Container Registry, so anyone can run
# Tattle without the source code:
#   ghcr.io/<owner>/tattle:latest   the latest release (a v1.2.3 tag)
#   ghcr.io/<owner>/tattle:1.2.3    one release; :1.2 and :1 follow its line
#   ghcr.io/<owner>/tattle:main     the main branch, for testing
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Docker image (amd64, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tattle
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Tattle
            org.opencontainers.image.description=Self-hosted bug reports and feature requests, triaged by your AI agents
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TATTLE_BUILD_VERSION=${{ steps.meta.outputs.version }}
            TATTLE_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
