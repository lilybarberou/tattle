name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tattle
          POSTGRES_PASSWORD: tattle
          POSTGRES_DB: tattle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tattle -d tattle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm version comes from "packageManager" in package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check

      - name: Typecheck (web, widgets)
        run: pnpm typecheck

      - name: Build widget
        run: pnpm --filter @tattlehq/widget build

      - name: Build React Native SDK
        run: pnpm --filter @tattlehq/react-native build

      - name: Test
        run: pnpm test
        env:
          # The tests empty every table: the database name must end in _test.
          TEST_DATABASE_URL: postgres://tattle:tattle@localhost:5432/tattle_test

      - name: Build web
        run: pnpm --filter web build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build (no push)
        run: docker build .

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Starts its own Postgres and Mailpit (e2e/docker-compose.e2e.yml),
      # builds the widget and the app, then runs Playwright. Everything stays
      # on the runner: playwright.config.ts refuses any non-local address.
      - name: Run the suite
        run: pnpm test:e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Stop the containers
        if: always()
        run: pnpm --filter web e2e:down
