packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - esbuild
  - lightningcss
# Security fixes in transitive dependencies (pnpm audit). Remove each one
# once the parent package ships the fix itself.
overrides:
  # drizzle-kit > @esbuild-kit/core-utils still asks for esbuild ~0.18
  # (GHSA-67mh-4wv8-2f99). 0.25.x: the one drizzle-kit itself depends on.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # @tailwindcss/typography pins 6.0.10 (GHSA-rj75-hqrm-r3gf).
  "@tailwindcss/typography>postcss-selector-parser": ^6.1.5
  # Dev only: expo, installed as a peer of the React Native SDK
  # (GHSA-g3hv-75wg-m249).
  "@expo/fingerprint>minimatch": 11.0.5
